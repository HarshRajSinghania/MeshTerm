name: Feature request
description: Something MeshTerm should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        MeshTerm is one person's spare time, so the honest answer to a good idea is often
        "yes, eventually". Saying what you are actually trying to do — rather than the
        feature you have in mind — often finds something that already works.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, not the feature. What are you trying to find out about your mesh?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: If you have a shape in mind — a screen, a key, a subcommand — describe it.

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, if there is one. This says more about how much the feature is worth than anything else.
